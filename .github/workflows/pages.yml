# Optional project-site Pages deploy (veigapunk.github.io/plazir-15-site/).
# Primary live host is the user site: https://veigapunk.github.io/ (VeigaPunk.github.io).
# Manual only until Settings → Pages → Source → GitHub Actions is enabled on this repo.
name: Deploy GitHub Pages (project optional)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

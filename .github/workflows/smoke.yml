# CI gate — content/asset/local HTTP smoke (not GitHub Pages deploy).
name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local smoke
        run: ./scripts/smoke.sh

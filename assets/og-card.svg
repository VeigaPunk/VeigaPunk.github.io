<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Plazir-15 Fan Codex">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1418"/>
      <stop offset="55%" stop-color="#0c1a1f"/>
      <stop offset="100%" stop-color="#12262e"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#7eb896" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7eb896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#5eb8b0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5eb8b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- dome silhouette -->
  <ellipse cx="600" cy="560" rx="420" ry="70" fill="#3d6b55" opacity="0.35"/>
  <path d="M250 520 C320 320 480 220 600 220 C720 220 880 320 950 520" fill="none" stroke="#c5d4dc" stroke-width="6" opacity="0.55"/>
  <path d="M280 520 C340 360 480 280 600 280 C720 280 860 360 920 520" fill="#12262e" opacity="0.85"/>
  <path d="M300 520 H900" stroke="#7eb896" stroke-width="4" opacity="0.7"/>
  <text x="80" y="120" fill="#c9a96e" font-family="Georgia, serif" font-size="28" letter-spacing="6">UNOFFICIAL FAN CODEX</text>
  <text x="80" y="220" fill="#e8f1f4" font-family="Georgia, serif" font-size="96" font-weight="700">Plazir-15</text>
  <text x="80" y="290" fill="#9bb0b8" font-family="system-ui, sans-serif" font-size="32">Domed paradise of the Outer Rim</text>
  <text x="80" y="360" fill="#5eb8b0" font-family="system-ui, sans-serif" font-size="24">The Mandalorian · Chapter 22: Guns for Hire</text>
  <text x="80" y="580" fill="#6d828c" font-family="system-ui, sans-serif" font-size="22">Not Lucasfilm · Fan documentation</text>
